services:
  postgres:
    image: postgres:16-alpine
    container_name: mailbox-order-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailbox
      POSTGRES_PASSWORD: mailbox
      POSTGRES_DB: mailbox_orders
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailbox -d mailbox_orders"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
